packages:
  - apps/*
  - packages/*
  - internal/*
  - vendor/*

catalog:
  '@base-ui/react': ^1.7.0
  '@hugeicons/core-free-icons': ^4.3.0
  '@hugeicons/react': ^1.1.10
  '@radix-ui/react-use-controllable-state': ^1.2.6
  '@react-email/components': ^1.0.12
  '@rescale/nemo': 2.2.0
  '@sentry/browser': ^10.73.0
  '@sentry/nextjs': ^10.73.0
  '@shikijs/core': ^4.4.3
  '@shikijs/engine-javascript': ^4.4.3
  '@shikijs/langs': ^4.4.3
  '@shikijs/themes': ^4.4.3
  '@t3-oss/env-core': ^0.13.11
  '@t3-oss/env-nextjs': ^0.13.11
  '@types/node': ^24.13.3
  ai: 6.0.275
  babel-plugin-react-compiler: ^1.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.1.1
  dotenv-cli: ^11.0.0
  effect: ^3.22.1
  import-in-the-middle: ^3.4.0
  motion: ^12.43.0
  nanoid: ^5.1.16
  next-themes: ^0.4.6
  portless: ^0.15.6
  require-in-the-middle: ^8.0.1
  resend: ^6.25.0
  shadcn: ^4.19.1
  streamdown: ^2.6.0
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  typescript: ^5.9.3
  use-stick-to-bottom: 1.1.6
  vitest: ^4.1.11
  vgpu: 0.3.1
  '@webgpu/types': 0.1.72
  zod: ^4.5.4

catalogs:
  next16:
    next: ^16.3.4
  react19:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.5
    react: ^19.2.8
    react-dom: ^19.2.8
  tailwind4:
    '@tailwindcss/postcss': 4.3.3
    postcss: 8.5.26
    tailwindcss: 4.3.3

enablePrePostScripts: true
fetchRetries: 3
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000

overrides:
  '@hono/node-server': ^1.19.15
  body-parser: ^2.3.0
  brace-expansion: ^5.0.9
  browserslist: ^4.28.7
  fast-uri: ^3.1.5
  hono: ^4.12.34
  ip-address: ^10.3.1
  js-yaml: ^4.3.1
  'nanoid@<5': 3.3.18
  postcss: 8.5.26
  postcss-selector-parser: ^7.1.3
  qs: ^6.15.2
  'shadcn>zod': 3.25.76
  'ws@<8': 7.5.11

allowBuilds:
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  '@vgpu/adapter-node': false
  esbuild: false
  sharp: false
  webgpu: false

publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.187'
  - ai@6.0.275
